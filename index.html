<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tarea10</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        #contenedor {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3,140px);
            gap: 5px;
            max-width: 800px;
            margin-top: 20px;
            background-color: whitesmoke;
            padding: 5px;
            border: 2px solid black;
        }
        .caja {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            border: 1px solid black;
        }
        .caja-uno {
            grid-column: 1;
            grid-row: 1/4;
            background-color: #1baf20;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .caja-dos {
            grid-column: 2/4;
            grid-row: 1;
            background-color: #1baf20;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .caja-tres {
            grid-column: 4;
            grid-row: 1;
            background-color: #e90000;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .caja-cuatro {
            grid-column: 4;
            grid-row: 2/4;
            background-color: #1baf20;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .caja-cinco {
            grid-column: 2;
            grid-row: 2;
            background-color: #f39810;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .caja-seis {
            grid-column: 3;
            grid-row: 3;
            background-color: #f39810;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .caja-siete {
            grid-column: 3;
            grid-row: 2;
            background-color: #e90000;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .caja-ocho {
            grid-column: 2;
            grid-row: 3;
            background-color: #e90000;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Grid</h1>
    <div id="contenedor">
        <div class="caja-uno">Uno</div>
        <div class="caja-dos">Dos</div>
        <div class="caja-tres">Tres</div>
        <div class="caja-cuatro">Cuatro</div>
        <div class="caja-cinco">Cinco</div>
        <div class="caja-seis">Seis</div>
        <div class="caja-siete">Siete</div>
        <div class="caja-ocho">Ocho</div>
    </div>
</body>
</html>
